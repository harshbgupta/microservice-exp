[versions]
#SDK version
compileSdk = "34"
minSdk = "24"
targetSdk = "31"

# Version control
versionMajor = "1"
versionMinor = "0"
versionBuild = "0"
versionPatch = "0"

#lib versions
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
material = "1.12.0"
dataStore = "1.1.1"
fragmentKtx = "1.7.1"
coreKtx = "1.13.1"
appcompat = "1.6.1"
activity = "1.9.0"
constraintlayout = "2.1.4"
retofit2 = "2.9.0"
squareupOkhttp3 = "4.10.0"
chucker = "3.5.2"
timberLog = "5.0.1"
leakCanary = "2.9.1"
lifecycle = "2.8.0"
paging3 = "3.3.0"
navigation = "2.7.7"
hilt = "2.48"
intuit = "1.1.0"
coil = "2.2.2"
glide = "4.15.1"
firebaseMessagingKtx = "24.0.0"
firebaseCommonKtx = "21.0.0"
firebaseCrashlyticsKtx = "19.0.0"
firebaseAnalyticsKtx = "22.0.0"

#Plugin Version
agp = "8.3.2"
kotlin = "1.9.0"
navArgs = "2.7.7"
googleService = "4.4.1"
crashlyticsPlugin = "3.0.1"
navigationFragmentKtx = "2.7.7"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
hiltLibrary = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlinParcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
navSafeArgs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navArgs" }
googleServices = { id = "com.google.gms.google-services", version.ref = "googleService" }
crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }

