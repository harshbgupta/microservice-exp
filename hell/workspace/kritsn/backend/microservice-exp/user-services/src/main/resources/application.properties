# ========================
# Common Config
# ========================
spring.application.name=user-services
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
server.port=8081
# ========================
# DB Config default for all envs (dev and prod in profiles)
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/ms-exp-user-db
spring.datasource.username=root
spring.datasource.password=qwerty
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Connection pool: conservative defaults; profiles can override
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1200000
# JPA defaults (safe for all envs)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Migrations (recommended for all envs; optional if not using)
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration
# ========================
# Circuit Breaker Config (Using Resilience)
# ========================
resilience4j.circuitbreaker.instances.authRefresh.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authRefresh.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.authRefresh.slidingWindowSize=20
resilience4j.circuitbreaker.instances.authRefresh.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.authRefresh.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.authRefresh.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.authRefresh.automaticTransitionFromOpenToHalfOpenEnabled=true
# ========================
# Retry Config (Using Resilience)
# ========================
resilience4j.retry.instances.authRefreshRetry.maxAttempts=3
resilience4j.retry.instances.authRefreshRetry.waitDuration=2s
resilience4j.retry.instances.authRefreshRetry.retryExceptions[0]=java.io.IOException
resilience4j.retry.instances.authRefreshRetry.retryExceptions[1]=java.net.SocketTimeoutException
# ========================
# Rate Limiter Config (Using Resilience)
# ========================
resilience4j.ratelimiter.instances.userServiceRateLimiter.limit-for-period=3
resilience4j.ratelimiter.instances.userServiceRateLimiter.limit-refresh-period=10s
resilience4j.ratelimiter.instances.userServiceRateLimiter.timeout-duration=0
# ========================
# Logging
# ========================
#For structured logging in the console
logging.level.org.springframework=DEBUG
logging.level.org.springframework.beans.factory=DEBUG
logging.level.org.springframework.beans.factory.support=DEBUG

logging.pattern.console=%clr(%d{HH:mm:ss}){yellow} %clr([${spring.application.name}]){magenta} %clr(%level){blue}: %msg%n
#For structured logging in File
logging.structured.format.file=ecs
logging.file.name=logs/user-services.log