version: "3.9"

networks:
  user-network:

services:
  mysql:
    image: mysql:latest
    container_name: mysql
    networks: [ user-network ]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: qwerty
      MYSQL_DATABASE: ms-exp-user-db
    volumes:
      - /var/lib/microserviceExp/user-service-volume/mysql:/var/lib/mysql

  user-service:
    build:
      context: ..
      dockerfile: user-services/Dockerfile
    image: user-service:local
    container_name: user-service
    networks: [ user-network ]
    depends_on: [ mysql ]
    ports:
      - "8080:8080"
    environment:
      # service-to-service hostname is the service name 'mysql'
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ms_exp_user_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    # Optional: if you enabled actuator
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    # No, you don’t need a volume for your user-service container itself.